openapi: 3.1.0
info:
  title: LuxeKnox Gym API
  version: 0.1.0
  summary: Shared REST contract for the Nest backend and Flutter client.
  description: |
    Source of paths: `docs/backend-frd.md` §24.
    Auth and envelope: ADR-0003.
    Prefix `/v1` lives on the server URL.

    Money is a two-decimal string. IDs are int64. Timestamps are UTC ISO-8601.
    List envelope is `{ data, meta }`. Errors are `{ code, message, details, request_id }`.

    `x-status`: `module-0` (spine), `mvp` (build with the vertical), `deferred` (ADR-0005, do not call).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:3000/v1
    description: Local
  - url: https://api.example.com/v1
    description: Production (replace host)
tags:
  - name: API
  - name: AUTH
  - name: RBAC
  - name: PEOPLE
  - name: HEALTH
  - name: MEMB
  - name: PT
  - name: SCHED
  - name: ATTN
  - name: PAY
  - name: WORK
  - name: DIET
  - name: GOAL
  - name: NOTIF
  - name: DASH
  - name: RPT
  - name: SYS
  - name: MEDIA
  - name: ACCT
  - name: INV
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Process liveness
      tags: [API]
      x-status: module-0
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /ready:
    get:
      operationId: getReady
      summary: Database readiness
      tags: [API]
      x-status: module-0
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          description: Database is disconnected or unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
  /auth/login:
    post:
      operationId: login
      summary: Login with email or phone + password
      tags: [AUTH]
      x-status: module-0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"

  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate refresh token; reuse revokes the family
      tags: [AUTH]
      x-status: module-0
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"

  /auth/logout:
    post:
      operationId: logout
      summary: Revoke current session
      tags: [AUTH]
      x-status: module-0
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
  /auth/password/change:
    post:
      operationId: changePassword
      summary: Change password; invalidates other sessions
      tags: [AUTH]
      x-status: mvp
      x-parity: required
      x-permission: users.update
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Request a password-reset token
      tags: [AUTH]
      x-status: mvp
      x-parity: required
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          description: No content
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"

  /auth/password/reset:
    post:
      operationId: resetPassword
