components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Access token `gk_at_<base64url>`. Never a JWT. Never a query param.
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Turnstile/reader credential. Scoped to attendance ingest only.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
      description: Default from gym_settings pagination.default_page_size.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
      description: Admin tables that need page numbers.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor on (created_at, id) for feeds.
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Case-insensitive search (FR-API-014).
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: created_at:desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Required in practice on payments, check-in, booking, freeze (FR-API-008).
  responses:
    Error400:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Error401:
      description: Missing or expired session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Error403:
      description: Permission or row-scope failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Error404:
      description: Unknown or out-of-scope id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Error409:
      description: Version mismatch or unique conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Error422:
      description: Business rule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
    Error429:
      description: Rate limited
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorCode:
      type: string
      enum:
        - validation_error
        - unauthenticated
        - forbidden
        - not_found
        - conflict
        - business_rule
        - rate_limited
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string
    ErrorBody:
      type: object
      required: [code, message, details, request_id]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
        request_id:
          type: string
    Money:
      type: string
      pattern: "^-?\\d+\\.\\d{2}$"
      description: DECIMAL(12,2) as a two-decimal string. Never a JSON number.
      example: "1299.00"
    Quantity3:
      type: string
      pattern: "^\\d+\\.\\d{3}$"
      description: DECIMAL(14,3) quantity as a three-decimal string. Never a JSON number.
      example: "10.000"
    DiscountAmount:
      type: string
      pattern: "^\\d+(\\.\\d{1,2})?$"
      description: Unsigned money with at most two decimals. Used for sale discount inputs.
      example: "50.00"
    Id:
      type: integer
      format: int64
      minimum: 1
    DateTime:
      type: string
      format: date-time
      description: UTC ISO-8601
    Date:
      type: string
      format: date
    PageMeta:
      type: object
      required: [limit, has_more]
      properties:
        limit:
          type: integer
        offset:
          type: integer
          nullable: true
        cursor:
          type: string
          nullable: true
        next_cursor:
          type: string
          nullable: true
        has_more:
          type: boolean
        total:
          type: integer
          nullable: true
          description: Present on offset lists; omitted on cursor feeds.
    UserType:
      type: string
      enum: [member, trainer, employee, admin]
    UserStatus:
      type: string
      enum: [active, inactive, suspended]
    PermissionAction:
      type: string
      enum: [create, read, update, delete, approve, export, broadcast, write, client_sign, lifestyle]
    Health:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok]
        timestamp:
          $ref: "#/components/schemas/DateTime"
    Ready:
      type: object
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [connected, disconnected]
        timestamp:
          $ref: "#/components/schemas/DateTime"
        jobs:
          type: object
          nullable: true
          properties:
            failure_count:
              type: integer
            retry_count:
              type: integer
            last_success_at:
              $ref: "#/components/schemas/DateTime"
              nullable: true
    LoginRequest:
      type: object
      required: [password]
      properties:
        identifier:
          type: string
          maxLength: 255
          description: Email or phone number (Nest unified field).
        email:
          type: string
          format: email
        phone_number:
          type: string
          description: E.164
        password:
          type: string
          format: password
      description: Supply identifier, email, or phone_number (at least one) plus password.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Opaque `gk_rt_…`
      description: Provide refresh_token (must start with gk_rt_).
    LogoutRequest:
      type: object
      properties:
        all:
          type: boolean
          default: false
          description: If true, revoke every session for this user.
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        phone_number:
          type: string
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
        new_password:
          type: string
          format: password
    Principal:
      type: object
      required: [user_id, user_type, role, permissions]
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        user_type:
          $ref: "#/components/schemas/UserType"
        role:
          type: string
        role_id:
          $ref: "#/components/schemas/Id"
        profile_id:
          type: integer
          format: int64
          nullable: true
        permissions:
          type: array
          items:
            type: string
    SessionResponse:
      type: object
      required: [access_token, refresh_token, principal]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        principal:
          $ref: "#/components/schemas/Principal"
    MeResponse:
      type: object
      required: [user, principal, profile]
      properties:
        user:
          $ref: "#/components/schemas/User"
        principal:
          $ref: "#/components/schemas/Principal"
        profile:
          description: Null for Super Admin without an employee row (FR-AUTH-009) and until PEOPLE exists.
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/Member"
            - $ref: "#/components/schemas/Trainer"
            - $ref: "#/components/schemas/Employee"
    User:
      type: object
      required: [id, user_type, status]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        email:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        user_type:
          $ref: "#/components/schemas/UserType"
        role_id:
          $ref: "#/components/schemas/Id"
        avatar_url:
          type: string
          format: uri
          nullable: true
        status:
          $ref: "#/components/schemas/UserStatus"
        created_at:
          $ref: "#/components/schemas/DateTime"
        updated_at:
          $ref: "#/components/schemas/DateTime"
    Role:
      type: object
      required: [id, name, is_system_role]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        description:
          type: string
          nullable: true
        is_system_role:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
    RoleWrite:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
    RolePermissionsWrite:
      type: object
      required: [permission_ids]
      properties:
        permission_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
    Permission:
      type: object
      required: [id, module, action, slug]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        module:
          type: string
        action:
          type: string
        slug:
          type: string
    RolePage:
      type: object
