  /members/{id}/pt-reviews:
    post:
      operationId: createPtProgressReviewDraft
      summary: Draft a PT progress review
      description: >
        Snapshots the member's measurements into `body_metrics_snapshot` as the
        five presentation-card rows (weight, waist, strength, cardio, other), in
        that order. Start is the latest value on or before the period start and
        current is the latest on or before the period end (calendar dates, end
        day included). Change is current − start, rounded half away from zero to
        two decimals, and is null unless both exist. Targets come from in-progress
        or achieved goals, not from goal baseline or current values. A row with
        no matching metric is still present with null values. New drafts leave
        `performance_markers_snapshot` null. `highlights_other_text` is accepted
        only when `progress_highlights` includes `other`.
      tags: [PT]
      x-status: mvp
      x-parity: required
      x-permission: pt_reviews.write
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
