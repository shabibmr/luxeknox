    patch:
      operationId: updatePtProgressReviewDraft
      summary: Save the presentation card of a draft review
      description: >
        Partial update of a review that is still a `draft`: the highlight
        checkboxes, the other-text line, the summary, the member's feedback, the
        next phase, and the six discussed checks. Omitted fields are left alone,
        an explicit null clears one, and `progress_highlights` replaces the whole
        set. Only the review's trainer may edit. `highlights_other_text` is
        accepted only when `other` is selected, and deselecting `other` clears
        the stored text. `next_review_date` must be after `review_period_end`.
        The period and the measure rows cannot be changed here. Once the review
        is no longer a draft the edit is refused with 409.
