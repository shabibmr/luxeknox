          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          format: password
        first_name:
          type: string
        last_name:
          type: string
        gender:
          type: string
        date_of_birth:
          $ref: "#/components/schemas/Date"
        address:
          type: string
        assigned_trainer_id:
          $ref: "#/components/schemas/Id"
        notes:
          type: string
    MemberUpdate:
      type: object
