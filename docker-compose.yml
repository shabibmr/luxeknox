services:
  postgres:
    image: postgres:17-alpine
    container_name: luxeknox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: luxeknox
      POSTGRES_USER: luxeknox
      POSTGRES_PASSWORD: luxeknox_secret
    ports:
      - "5432:5432"
    volumes:
      - ./apps/api/docker/postgres.conf:/etc/postgresql/postgresql.conf:ro
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "luxeknox", "-d", "luxeknox"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
