# PostgreSQL 17 configuration for LuxeKnox.
# Replaces apps/api/docker/mysql.cnf — see docs/adr/0009-postgresql-migration.md.
#
# Note on collation/case-sensitivity (ADR-0009 Decision 2): unlike MySQL's
# utf8mb4_0900_ai_ci, PostgreSQL has no server-level case/accent-insensitive
# default. That's handled at the query layer (ilike()) and schema layer
# (CHECK (email = lower(email))), not here.

listen_addresses = '*'

# UTC everywhere. With TIMESTAMPTZ columns (ADR-0009 Decision 1) storage is
# offset-correct regardless, but this keeps now()-rendered output and session
# display consistent, and is required for the round-trip test to mean anything.
timezone = 'UTC'
log_timezone = 'UTC'

# Matches the previous MySQL transaction-isolation = READ-COMMITTED setting.
# This is PostgreSQL's default; set explicitly so the intent is documented.
default_transaction_isolation = 'read committed'

# WAL archiving groundwork for NFR-004 point-in-time recovery (PG-39 drill).
# wal_level=replica is the default in PostgreSQL 17; listed here for clarity.
wal_level = replica
max_wal_senders = 3
