name: TEMP update goldens

on:
  push:
    branches: [fix/ci-typecheck-format]

permissions:
  contents: write

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-typecheck-format

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter test --update-goldens test/features/foods/presentation/food_goldens_test.dart

      - name: Commit regenerated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A test
          git diff --cached --quiet && exit 0
          git commit -m "test(app): regenerate food goldens on Linux"
          git push
