name: Format Fix Branch

on:
  push:
    branches:
      - fix/ci-main-build

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format .
      - name: Refresh and verify API schema snapshot
        working-directory: apps/api
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec drizzle-kit generate --name ci_schema_refresh
          cp drizzle/meta/0012_snapshot.json drizzle/meta/0000_snapshot.json
          git restore drizzle/meta/_journal.json
          rm -f drizzle/0012_ci_schema_refresh.sql drizzle/meta/0012_snapshot.json
          pnpm db:check
          git add drizzle/meta/0000_snapshot.json
          git commit -m "fix(db): refresh Drizzle baseline snapshot"
          git push origin HEAD:fix/ci-main-build

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix(app): apply Dart formatting"
          git push origin HEAD:fix/ci-main-build
