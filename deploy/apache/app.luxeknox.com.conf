# LuxeKnox Flutter web app - static SPA served from /var/www/html/luxeknox-app.
#
# One-time setup on the server:
#   sudo mkdir -p /var/www/html/luxeknox-app
#   sudo chown www-data:www-data /var/www/html/luxeknox-app
#   sudo cp deploy/apache/app.luxeknox.com.conf /etc/apache2/sites-available/
#   sudo a2ensite app.luxeknox.com
#   sudo systemctl reload apache2
#   sudo certbot --apache -d app.luxeknox.com   # issues the cert and adds the
#                                                # -le-ssl.conf + https redirect
#
# deploy/deploy.sh rsyncs app/build/web/ into this docroot on every deploy.

<VirtualHost *:80>
    ServerName app.luxeknox.com
    DocumentRoot /var/www/html/luxeknox-app

    <Directory /var/www/html/luxeknox-app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Flutter SPA routing
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/app.luxeknox.com-error.log
    CustomLog ${APACHE_LOG_DIR}/app.luxeknox.com-access.log combined
</VirtualHost>
