# LuxeKnox API - reverse proxy to the pm2-managed Nest process on 127.0.0.1:3010.
#
# One-time setup on the server:
#   sudo cp deploy/apache/api.luxeknox.com.conf /etc/apache2/sites-available/
#   sudo a2ensite api.luxeknox.com
#   sudo systemctl reload apache2
#   sudo certbot --apache -d api.luxeknox.com   # issues the cert and adds the
#                                                # -le-ssl.conf + https redirect
#
# Requires mod_proxy, mod_proxy_http (already enabled on this host).

<VirtualHost *:80>
    ServerName api.luxeknox.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3010/
    ProxyPassReverse / http://127.0.0.1:3010/

    ErrorLog ${APACHE_LOG_DIR}/api.luxeknox.com-error.log
    CustomLog ${APACHE_LOG_DIR}/api.luxeknox.com-access.log combined
</VirtualHost>
